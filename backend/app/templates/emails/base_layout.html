<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cyanea{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f0f4f8;font-family:'Segoe UI',Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f4f8;padding:32px 0;">
        <tr>
            <td align="center">
                <table width="560" cellpadding="0" cellspacing="0"
                    style="background:#ffffff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.08);overflow:hidden;">

                    <tr>
                        <td style="background:#1e3e7b;padding:28px 40px;text-align:center;">
                            <img src="https://raw.githubusercontent.com/luciagiampieri/CODE_CYANEA/main/backend/app/templates/emails/assets/cyanea_logo_manteca.png?v=999" alt="Cyanea" width="40" height="57" style="display:block;margin:0 auto 10px;border:0;" />
                            <h1 style="margin:0;color:#ffec80;font-size:28px;letter-spacing:1px;">Cyanea</h1>
                            <p style="margin:6px 0 0;color:#ffffff;font-size:13px;">Muchas manos, un único destino</p>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:36px 40px;">
{% block content %}{% endblock %}
                        </td>
                    </tr>

                    <tr>
                        <td style="background:#f7f9fc;padding:20px 40px;text-align:center;
                                border-top:1px solid #e8edf4;">
                            <p style="margin:0;color:#999;font-size:12px;">
                                Este es un mensaje automático, por favor no respondas a este correo.<br>
                                © 2026 Cyanea — UTN FRC
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
